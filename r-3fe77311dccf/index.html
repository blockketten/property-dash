    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-color: #f1f5f9;
            --text-muted: #94a3b8;
            --primary: #10b981;
            --primary-hover: #059669;
            --accent-blue: #3b82f6;
            --accent-orange: #f97316;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(135deg, #022c22, #0f172a);
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(to right, #10b981, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-meta {
            font-size: 14px;
            color: var(--text-muted);
        }

        .dashboard-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            padding: 20px 40px;
            flex-grow: 1;
        }

        @media (min-width: 1200px) {
            .dashboard-container {
                grid-template-columns: 350px 1fr;
            }
        }

        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* Left Controls Panel */
        .controls-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: fit-content;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .profile-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px;
            border-radius: 10px;
        }

        .profile-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .profile-btn.active {
            background: var(--primary);
            color: #ffffff;
        }

        .country-checkboxes {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 15px;
            text-transform: none;
            color: var(--text-color);
        }

        input[type="checkbox"] {
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .stat-val {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .stat-lbl {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Right Map and Listings Area */
        .workspace-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        #map {
            height: 400px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            z-index: 1;
        }

        /* Table CSS */
        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 15px;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            transition: color 0.3s;
        }

        th:hover {
            color: var(--text-color);
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-score-high {
            background-color: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .badge-score-mid {
            background-color: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.4);
        }

        .badge-score-low {
            background-color: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .badge-flag {
            background-color: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
            margin-right: 4px;
            margin-bottom: 4px;
            text-transform: none;
        }

        .badge-flag-ban {
            background-color: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .badge-flag-viable {
            background-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        /* Map Popups */
        .leaflet-popup-content-wrapper {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
        }

        .leaflet-popup-tip {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
        }

        .popup-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 200px;
        }

        .popup-img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
        }

        .popup-title {
            font-weight: 600;
            font-size: 13px;
        }

        .popup-price {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary);
        }

        .popup-stats {
            font-size: 11px;
            color: var(--text-muted);
        }
    </style>
</head>

                const country = getCountryCode(l);
                let countryMatch = false;
                if (country === 'GR' && grChecked) countryMatch = true;
                if (country === 'CY' && cyChecked) countryMatch = true;
                if (country === 'JP' && jpChecked) countryMatch = true;
                if ((country === 'ES' || country === 'PT') && (grChecked || cyChecked)) countryMatch = true; // Show Spain/Portugal on Med relocation

                return profileMatch && countryMatch;
            });

            // Sort data
            filtered.sort((a, b) => {
                let valA = a[sortedColumn];
                let valB = b[sortedColumn];
                
                // Handle nulls
                if (valA === null || valA === undefined) return sortDirection === 'asc' ? 1 : -1;
                if (valB === null || valB === undefined) return sortDirection === 'asc' ? -1 : 1;

                if (typeof valA === 'string') {
                    return sortDirection === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                } else {
                    return sortDirection === 'asc' ? valA - valB : valB - valA;
                }
            });

            renderTable(filtered);
            renderMapPins(filtered);
            updateStats(filtered);
        }

        // Listing fields (title, url, photo_url, neighborhood) come from scraped
        // external pages = untrusted input. Escape before any innerHTML interpolation.
        function esc(v) {
            return String(v ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Scheme allowlist for href/src: only http(s) URLs survive.
        function safeUrl(u) {
            const s = String(u ?? '');
            return (s.startsWith('http://') || s.startsWith('https://')) ? esc(s) : '';
        }

        function renderTable(data) {
            const headersTr = document.getElementById('table-headers');
            const bodyTbody = document.getElementById('table-body');
            
            headersTr.innerHTML = '';
            bodyTbody.innerHTML = '';

            // Setup headers depending on profile
            if (currentProfile === 'investment') {
                headersTr.innerHTML = `
                    <th onclick="changeSort('title')">Property</th>
                    <th onclick="changeSort('city')">Location</th>
                    <th onclick="changeSort('price_eur')">Price</th>
                    <th onclick="changeSort('net_yield')">Yield</th>
                    <th onclick="changeSort('cash_down_eur')">Cash Down</th>
                    <th onclick="changeSort('deal_score')">Score</th>
                    <th>Flags</th>
                `;

                data.forEach(l => {
                    const yieldText = l.net_yield ? (l.net_yield * 100).toFixed(1) + '%' : '-';
                    const cashText = l.cash_down_eur ? '€' + l.cash_down_eur.toLocaleString() : '-';
                    const scoreText = l.deal_score ? l.deal_score + '/100' : '-';
                    const scoreBadgeClass = l.deal_score >= 75 ? 'badge-score-high' : (l.deal_score >= 50 ? 'badge-score-mid' : 'badge-score-low');
                    
                    const flagsHtml = l.regulatory_flags.map(f => {
                        const isBan = f.includes('BAN') ? 'badge-flag-ban' : (f.includes('VIABLE') || f.includes('TOKKU') ? 'badge-flag-viable' : '');
                        return `<span class="badge badge-flag ${isBan}">${esc(f)}</span>`;
                    }).join('');

                    const u = safeUrl(l.url) || '#';
                    const img = safeUrl(l.photo_url);
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>
                            <div style="display: flex; gap: 10px; align-items: center;">
                                ${img ? `<img src="${img}" style="width: 50px; height: 40px; object-fit: cover; border-radius: 4px;">` : `<div style="width: 50px; height: 40px; background: rgba(255,255,255,0.05); border-radius: 4px; display:flex; align-items:center; justify-content:center; font-size:10px;">No Pic</div>`}
                                <div>
                                    <a href="${u}" target="_blank" rel="noopener noreferrer" style="color: var(--text-color); font-weight: 500; text-decoration: none;">${esc(l.title)}</a>
                                    <div style="font-size: 11px; color: var(--text-muted);">${l.sqm} sqm | Year: ${l.construction_year || '-'}</div>
                                </div>
                            </div>
                        </td>
                        <td><span style="text-transform: capitalize;">${esc(l.city)}</span>, ${esc(l.neighborhood)}</td>
                        <td style="font-weight: 600;">€${l.price_eur.toLocaleString()}</td>
                        <td style="color: var(--primary); font-weight: 600;">${yieldText}</td>
                        <td>${cashText}</td>
                        <td><span class="badge ${scoreBadgeClass}">${scoreText}</span></td>
                        <td>${flagsHtml}</td>
                    `;
                    bodyTbody.appendChild(tr);
                });
            } else {
                // Relocation Headers
                headersTr.innerHTML = `
                    <th onclick="changeSort('title')">Property</th>
                    <th onclick="changeSort('city')">Location</th>
                    <th onclick="changeSort('price_eur')">Price</th>
                    <th onclick="changeSort('eur_per_sqm')">EUR/sqm</th>
                    <th onclick="changeSort('rooms')">Rooms</th>
                    <th onclick="changeSort('deal_score')">Score</th>
                `;

                data.forEach(l => {
                    const scoreText = l.deal_score ? l.deal_score + '%' : '-';
                    const scoreBadgeClass = l.deal_score <= 25 ? 'badge-score-high' : (l.deal_score <= 50 ? 'badge-score-mid' : 'badge-score-low');
                    
                    const u = safeUrl(l.url) || '#';
                    const img = safeUrl(l.photo_url);
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>
                            <div style="display: flex; gap: 10px; align-items: center;">
                                ${img ? `<img src="${img}" style="width: 50px; height: 40px; object-fit: cover; border-radius: 4px;">` : `<div style="width: 50px; height: 40px; background: rgba(255,255,255,0.05); border-radius: 4px; display:flex; align-items:center; justify-content:center; font-size:10px;">No Pic</div>`}
                                <div>
                                    <a href="${u}" target="_blank" rel="noopener noreferrer" style="color: var(--text-color); font-weight: 500; text-decoration: none;">${esc(l.title)}</a>
                                    <div style="font-size: 11px; color: var(--text-muted);">${l.sqm} sqm</div>
                                </div>
                            </div>
                        </td>
                        <td><span style="text-transform: capitalize;">${esc(l.city)}</span>, ${esc(l.neighborhood)}</td>
                        <td style="font-weight: 600;">€${l.price_eur.toLocaleString()}</td>
                        <td>€${l.eur_per_sqm.toLocaleString()}</td>
                        <td>${l.rooms}</td>
                        <td><span class="badge ${scoreBadgeClass}">${scoreText}</span></td>
                    `;
                    bodyTbody.appendChild(tr);
                });
            }
        }

        function changeSort(column) {
            if (sortedColumn === column) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortedColumn = column;
                sortDirection = 'desc';
            }
            filterData();
        }

        function renderMapPins(data) {
            // Clear existing markers
            mapMarkers.forEach(m => map.removeLayer(m));
            mapMarkers = [];

            let bounds = [];

            data.forEach(l => {
                if (l.latitude && l.longitude) {
                    const lat = parseFloat(l.latitude);
                    const lon = parseFloat(l.longitude);
                    bounds.push([lat, lon]);

                    // Determine circle color depending on score
                    let color = '#3b82f6'; // Blue default
                    if (currentProfile === 'investment') {
                        color = l.deal_score >= 75 ? '#10b981' : (l.deal_score >= 50 ? '#f59e0b' : '#ef4444');
                    } else {
                        // Relocation percentile score: lower is better
                        color = l.deal_score <= 25 ? '#10b981' : (l.deal_score <= 50 ? '#f59e0b' : '#ef4444');
                    }

                    const marker = L.circleMarker([lat, lon], {
                        radius: 8,
                        fillColor: color,
                        color: '#ffffff',
                        weight: 1.5,
                        opacity: 1,
                        fillOpacity: 0.85
                    }).addTo(map);

                    const pimg = safeUrl(l.photo_url);
                    const purl = safeUrl(l.url) || '#';
                    const popupHtml = `
                        <div class="popup-card">
                            ${pimg ? `<img class="popup-img" src="${pimg}">` : ''}
                            <div class="popup-title">${esc(l.title)}</div>
                            <div class="popup-price">€${l.price_eur.toLocaleString()}</div>
                            <div class="popup-stats">
                                <div>Size: ${l.sqm} sqm | Rooms: ${l.rooms}</div>
                                ${l.net_yield ? `<div>Net Yield: ${(l.net_yield * 100).toFixed(1)}%</div>` : ''}
                                ${l.deal_score ? `<div>Score: ${l.deal_score}</div>` : ''}
                            </div>
                            <a href="${purl}" target="_blank" rel="noopener noreferrer" style="color:#10b981; font-size:11px; font-weight:600; text-decoration:none;">Open Listing →</a>
                        </div>
                    `;

                    marker.bindPopup(popupHtml);
                    mapMarkers.push(marker);
                }
            });

            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [50, 50] });
            }
        }

        function updateStats(data) {
            document.getElementById('stat-count').innerText = data.length;
            
            if (currentProfile === 'investment') {
                const yields = data.map(l => l.net_yield).filter(y => y !== null);
                if (yields.length > 0) {
                    yields.sort((a, b) => a - b);
                    const mid = Math.floor(yields.length / 2);
                    const medianYield = yields.length % 2 !== 0 ? yields[mid] : (yields[mid - 1] + yields[mid]) / 2;
                    document.getElementById('stat-yield').innerText = (medianYield * 100).toFixed(1) + '%';
                } else {
                    document.getElementById('stat-yield').innerText = '-';
                }
            } else {
                // Medians for relocation (e.g. median price per sqm)
                const prices = data.map(l => l.eur_per_sqm).filter(p => p > 0);
                if (prices.length > 0) {
                    prices.sort((a, b) => a - b);
                    const mid = Math.floor(prices.length / 2);
                    const medianPrice = prices.length % 2 !== 0 ? prices[mid] : (prices[mid - 1] + prices[mid]) / 2;
                    document.getElementById('stat-yield').innerText = '€' + Math.round(medianPrice).toLocaleString();
                } else {
                    document.getElementById('stat-yield').innerText = '-';
                }
            }
        }

        // Run initial data render
        filterData();
    </script>
</body>
</html>
